name: Verify bundled macOS library loading

on:
  push:
    branches: [codex/openplayer-macos-loader]

permissions:
  contents: read

jobs:
  load:
    name: Load bundled libmpv (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: Build and run the native loader probe
        run: |
          brew install mpv pkg-config
          export OPENPLAYER_MPV_DIR="$(brew --prefix mpv)"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/probe-target"
          export PACKAGE_OUTPUT="$RUNNER_TEMP/probe-packages"
          app="$CARGO_TARGET_DIR/release/bundle/macos/OpenPlayer.app"
          mkdir -p "$app/Contents/MacOS"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>probe</string>
            <key>CFBundleIdentifier</key><string>dev.openplayer.loader-probe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>2.0.0</string>
            <key>CFBundleShortVersionString</key><string>2.0.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$RUNNER_TEMP/probe.c" <<'PROBE'
          #include <mpv/client.h>
          #include <stdio.h>

          int main(void) {
              unsigned long api = mpv_client_api_version();
              printf("Loaded libmpv client API %lu\n", api);
              return api == 0;
          }
          PROBE
          probe="$app/Contents/MacOS/probe"
          xcrun clang "$RUNNER_TEMP/probe.c" -I"$OPENPLAYER_MPV_DIR/include" \
            -L"$OPENPLAYER_MPV_DIR/lib" -lmpv \
            -Wl,-headerpad_max_install_names -o "$probe"
          node apps/desktop/scripts/bundle-macos-libmpv.mjs "$app"
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64 ;;
            X64) arch=x64 ;;
            *) exit 1 ;;
          esac
          bash apps/desktop/scripts/build-macos-dmg.sh 2.0.0 "$arch" false
          DYLD_PRINT_LIBRARIES=1 "$probe" 2> "$RUNNER_TEMP/loaded-libraries.txt"
          if grep -E '(/opt/homebrew/|/usr/local/|/Cellar/)' "$RUNNER_TEMP/loaded-libraries.txt"; then
            echo 'The bundled probe loaded a library from Homebrew' >&2
            exit 1
          fi
          grep -F "$app/Contents/Frameworks/libmpv" "$RUNNER_TEMP/loaded-libraries.txt"
