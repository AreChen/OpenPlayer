name: Diagnose installed macOS player

on:
  push:
    branches: [codex/openplayer-macos-loader]

permissions:
  actions: read
  contents: read

jobs:
  installed-repack:
    name: Install diagnostic DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      SOURCE_RUN: "46053483962"
      SOURCE_COMMIT: 1d83e7b6f7d38dca7caa849570d638a7121cf88e
      PACKAGE_TAG: v2.0.0
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - uses: actions/download-artifact@v7
        with:
          name: openplayer-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/source-package
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}

      - name: Verify input DMG and unchanged macOS player sources
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { join } from "node:path";
          import { packages } from "./apps/desktop/scripts/package-smoke-tools.mjs";

          const original = await packages(join(process.env.RUNNER_TEMP, "source-package"), process.env.PACKAGE_TAG);
          assert.equal(original.commit, process.env.SOURCE_COMMIT);
          assert.equal(original.platform, `macos-${process.env.PACKAGE_ARCH}`);
          console.log(`Verified input DMG and SHA-256 from ${original.commit}`);
          NODE
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- \
            Cargo.lock apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src \
            apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/src-tauri/tauri.macos.conf.json apps/desktop/src-tauri/src \
            ':(exclude,glob)apps/desktop/src-tauri/src/windows_gpui/**'

      - name: Install native packaging and sample media tools
        shell: bash
        run: |
          brew install mpv pkg-config
          if ! command -v ffmpeg; then
            brew install ffmpeg
          fi

      - name: Repack the installed application with its complete Mach-O dependency graph
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/diagnostic-target"
          export PACKAGE_OUTPUT="$RUNNER_TEMP/diagnostic-packages"
          version="${PACKAGE_TAG#v}"
          dmg="$RUNNER_TEMP/source-package/OpenPlayer_${version}_${PACKAGE_ARCH}.dmg"
          mount="$RUNNER_TEMP/source-mount"
          app="$CARGO_TARGET_DIR/release/bundle/macos/OpenPlayer.app"
          mkdir -p "$mount" "$(dirname "$app")"
          trap 'hdiutil detach "$mount" -quiet 2>/dev/null || true' EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          ditto "$mount/OpenPlayer.app" "$app"
          hdiutil detach "$mount"

          exe_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          exe="$app/Contents/MacOS/$exe_name"
          old_ref="$(otool -L "$exe" | awk '$1 ~ /^@executable_path\/\.\.\/Frameworks\/libmpv[^/]*\.dylib$/ { print $1 }')"
          test -n "$old_ref"
          brew_lib="$(brew --prefix mpv)/lib/${old_ref##*/}"
          test -f "$brew_lib"
          rm -rf "$app/Contents/Frameworks" "$app/Contents/_CodeSignature"
          install_name_tool -change "$old_ref" "$brew_lib" "$exe"

          node apps/desktop/scripts/bundle-macos-libmpv.mjs "$app"
          bash apps/desktop/scripts/build-macos-dmg.sh "$version" "$PACKAGE_ARCH" false

          mkdir -p "$RUNNER_TEMP/diagnostic-evidence"
          cp "$RUNNER_TEMP/source-package/build.json" "$RUNNER_TEMP/diagnostic-evidence/input-build.json"
          cp "$PACKAGE_OUTPUT/build.json" "$RUNNER_TEMP/diagnostic-evidence/repacked-build.json"

      - name: Build the standalone profile reader
        shell: bash
        run: |
          helper="$RUNNER_TEMP/package-profile-crate"
          mkdir -p "$helper/src"
          cp apps/desktop/src-tauri/examples/package-profile.rs "$helper/src/main.rs"
          cat > "$helper/Cargo.toml" <<'TOML'
          [package]
          name = "package-profile"
          version = "0.0.0"
          edition = "2024"

          [dependencies]
          redb = "=5.0.0"
          serde_json = "=1.0.154"
          TOML
          cargo generate-lockfile --manifest-path "$helper/Cargo.toml"
          cargo build --locked --manifest-path "$helper/Cargo.toml" --target-dir "$helper/target"

      - name: Exercise installed diagnostic DMG and isolated player profile
        shell: bash
        run: |
          node apps/desktop/scripts/run-package-smoke.mjs \
            "$RUNNER_TEMP/diagnostic-packages" "$PACKAGE_TAG" "$GITHUB_SHA" \
            "$RUNNER_TEMP/diagnostic-evidence" "$RUNNER_TEMP/package-profile-crate/target/debug/package-profile"

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: installed-repack-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/diagnostic-evidence/
          if-no-files-found: warn
