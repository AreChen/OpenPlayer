name: Verify the installed Intel macOS candidate

on:
  push:
    branches: [codex/openplayer-macos-loader]

permissions:
  actions: read
  contents: read

jobs:
  installed-repack:
    name: Install exact candidate DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
    env:
      SOURCE_RUN: "46058420694"
      SOURCE_COMMIT: 83551458220a0dffd8fdbda8b13f2aa7666246c1
      PACKAGE_TAG: v2.0.0
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - uses: actions/download-artifact@v7
        with:
          name: openplayer-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/source-package
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}

      - name: Verify input DMG and unchanged macOS player sources
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { join } from "node:path";
          import { packages } from "./apps/desktop/scripts/package-smoke-tools.mjs";

          const original = await packages(join(process.env.RUNNER_TEMP, "source-package"), process.env.PACKAGE_TAG);
          assert.equal(original.commit, process.env.SOURCE_COMMIT);
          assert.equal(original.platform, `macos-${process.env.PACKAGE_ARCH}`);
          console.log(`Verified input DMG and SHA-256 from ${original.commit}`);
          NODE
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- \
            Cargo.lock apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src \
            apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/src-tauri/tauri.macos.conf.json apps/desktop/src-tauri/src \
            ':(exclude,glob)apps/desktop/src-tauri/src/windows_gpui/**'

      - name: Install native packaging and sample media tools
        shell: bash
        run: |
          if ! command -v ffmpeg; then
            brew install ffmpeg
          fi

      - name: Build the standalone profile reader
        shell: bash
        run: |
          helper="$RUNNER_TEMP/package-profile-crate"
          mkdir -p "$helper/src"
          cp apps/desktop/src-tauri/examples/package-profile.rs "$helper/src/main.rs"
          cat > "$helper/Cargo.toml" <<'TOML'
          [package]
          name = "package-profile"
          version = "0.0.0"
          edition = "2024"

          [dependencies]
          redb = "=5.0.0"
          serde_json = "=1.0.154"
          TOML
          cargo generate-lockfile --manifest-path "$helper/Cargo.toml"
          cargo build --locked --manifest-path "$helper/Cargo.toml" --target-dir "$helper/target"

      - name: Exercise the exact installed DMG with the isolated player profile
        shell: bash
        run: |
          node apps/desktop/scripts/run-package-smoke.mjs \
            "$RUNNER_TEMP/source-package" "$PACKAGE_TAG" "$SOURCE_COMMIT" \
            "$RUNNER_TEMP/diagnostic-evidence" "$RUNNER_TEMP/package-profile-crate/target/debug/package-profile"

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: installed-intel-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/diagnostic-evidence/
          if-no-files-found: warn
