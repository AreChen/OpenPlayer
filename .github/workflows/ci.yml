name: CI

on:
  push:
    branches: [main, codex/openplayer-2.0-release]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libmpv-dev \
            librsvg2-dev \
            patchelf

      - name: Select the project Rust toolchain
        run: rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Check whitespace in the changes
        run: git diff-tree --check HEAD^ HEAD

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify shell architecture
        run: npm run verify:shell

      - name: Verify native translations
        run: node scripts/sync-native-locales.mjs --check

      - name: Run frontend behavior tests
        run: npm test

      - name: Verify release metadata
        run: npm run verify:release

      - name: Build frontend
        run: npm run build

  native-windows:
    name: Native shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        if: runner.os == 'macOS'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Select the project Rust toolchain
        run: rustc --version
      - name: Install Windows mpv
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./apps/desktop/scripts/restore-windows-mpv.ps1
          (Resolve-Path vendor/native/mpv/windows-x64).Path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install macOS mpv
        if: runner.os == 'macOS'
        run: |
          brew install mpv pkg-config
          prefix="$(brew --prefix mpv)"
          test -f "$prefix/include/mpv/render.h"
          test -f "$prefix/lib/libmpv.dylib"
          echo "OPENPLAYER_MPV_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build frontend assets
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Run platform Rust tests
        run: cargo test -p openplayer-desktop --locked
      - name: Run platform Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build native smoke executable
        if: runner.os == 'macOS'
        run: cargo build -p openplayer-desktop --locked --features window-smoke --bin window-smoke
      - name: Exercise native windows and mpv teardown
        if: runner.os == 'macOS'
        run: node apps/desktop/scripts/run-window-smoke.mjs
      - name: Verify Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = cargo tree -p openplayer-desktop --locked --target x86_64-pc-windows-msvc -e normal,build --prefix none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($deps -match '^(tauri|tao|wry|webview2)[ -]') { throw 'Unexpected web runtime dependency' }
          cargo build -p openplayer-desktop --locked --bin openplayer-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/debug/openplayer-desktop.exe --help
