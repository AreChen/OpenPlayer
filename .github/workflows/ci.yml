name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  native:
    name: Native Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          bash apps/desktop/scripts/install-linux-build-deps.sh
      - name: Restore Windows libmpv
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./apps/desktop/scripts/restore-windows-mpv.ps1
          (Resolve-Path vendor/native/mpv/windows-x64).Path >> $env:GITHUB_PATH
      - name: Install macOS libmpv
        if: runner.os == 'macOS'
        run: |
          brew install mpv pkg-config
          echo "OPENPLAYER_MPV_DIR=$(brew --prefix mpv)" >> "$GITHUB_ENV"
      - name: Check formatting and release metadata
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          node apps/desktop/scripts/verify-release.mjs
          git diff-tree --check HEAD^ HEAD
      - name: Build the Rust SDK guest example
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked -p openplayer-plugin-sdk --example smart_capture --no-default-features --release --target wasm32-unknown-unknown
      - name: Check native runtime dependencies
        shell: bash
        run: |
          cargo tree --locked -p openplayer-desktop -e normal,build --prefix none > "$RUNNER_TEMP/runtime-deps.txt"
          if grep -E '^(tauri|tao|wry|webview2|webkit2gtk)(-| )' "$RUNNER_TEMP/runtime-deps.txt"; then exit 1; fi
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -p openplayer-desktop -- --version
