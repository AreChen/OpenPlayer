name: Release

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable 2.x tag (for example v2.0.0)"
        required: true
        default: "v2.0.0"
        type: string
      stage_release:
        description: "Stage a GitHub draft from this exact source commit"
        default: false
        type: boolean
      publish:
        description: "Publish a previously staged and accepted draft"
        default: false
        type: boolean
      candidate_run_id:
        description: "Actions run ID that staged and validated the exact release files"
        type: string
      native_verification:
        description: "URL to the manual native acceptance record for that run and its package hashes"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Pin release source
    if: github.event_name != 'workflow_dispatch' || !inputs.publish
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      stage: ${{ steps.source.outputs.stage }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact commit, tag, and notes
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          STAGE_RELEASE: ${{ github.event_name == 'push' || inputs.stage_release }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable 2.x tag, got $RELEASE_TAG" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if [[ "$STAGE_RELEASE" == true ]]; then
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$commit"
            fi
          fi
          test -s "docs/releases/$RELEASE_TAG.md"
          {
            echo "tag=$RELEASE_TAG"
            echo "commit=$commit"
            echo "stage=$STAGE_RELEASE"
          } >> "$GITHUB_OUTPUT"

  draft:
    name: Create or verify draft
    needs: prepare
    if: needs.prepare.outputs.stage == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Stage release notes and pin the draft target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          legacy_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$legacy_tag" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish)"; then
            jq -e --arg sha "$RELEASE_COMMIT" '.isDraft and .targetCommitish == $sha' <<< "$draft"
            gh release edit "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --latest=false
          else
            gh release create "$RELEASE_TAG" --draft --latest=false --target "$RELEASE_COMMIT" \
              --title "OpenPlayer ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi

  packages:
    name: Build ${{ matrix.platform }} packages
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/build-desktop-packages
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          output: packages
          macos-distribution: ${{ needs.prepare.outputs.stage }}
          apple-certificate: ${{ runner.os == 'macOS' && needs.prepare.outputs.stage == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          apple-certificate-password: ${{ runner.os == 'macOS' && needs.prepare.outputs.stage == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          apple-signing-identity: ${{ runner.os == 'macOS' && needs.prepare.outputs.stage == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          apple-id: ${{ runner.os == 'macOS' && needs.prepare.outputs.stage == 'true' && secrets.APPLE_ID || '' }}
          apple-password: ${{ runner.os == 'macOS' && needs.prepare.outputs.stage == 'true' && secrets.APPLE_PASSWORD || '' }}
          apple-team-id: ${{ runner.os == 'macOS' && needs.prepare.outputs.stage == 'true' && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@v6
        with:
          name: openplayer-${{ matrix.platform }}
          path: packages
          if-no-files-found: error
          overwrite: true

  stage-assets:
    name: Verify and upload all draft assets
    needs: [prepare, draft, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          path: candidates
          pattern: openplayer-*
      - name: Check package checksums and provenance
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          node apps/desktop/scripts/stage-release-packages.mjs assemble \
            "$RELEASE_TAG" "$RELEASE_COMMIT" candidates release-files
      - uses: actions/upload-artifact@v6
        with:
          name: openplayer-release-files
          path: release-files
          if-no-files-found: error
          overwrite: true
      - name: Upload release files to the matching draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          draft="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets)"
          jq -e --arg sha "$RELEASE_COMMIT" '.isDraft and .targetCommitish == $sha' <<< "$draft"
          while IFS= read -r asset; do
            test -f "release-files/$asset"
          done < <(jq -r '.assets[].name' <<< "$draft")
          gh release upload "$RELEASE_TAG" release-files/* --clobber
          draft_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          printf 'Draft %s for commit `%s`\n\n%s\n' \
            "$RELEASE_TAG" "$RELEASE_COMMIT" "$draft_url" >> "$GITHUB_STEP_SUMMARY"

  package-validation:
    name: Native installation and upgrade validation
    needs: [prepare, packages]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.packages.result == 'success' || needs.packages.result == 'failure') }}
    uses: ./.github/workflows/package-validation.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      commit: ${{ needs.prepare.outputs.commit }}

  publish:
    name: Publish the verified draft
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify successful staged run and native acceptance record
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          NATIVE_VERIFICATION: ${{ inputs.native_verification }}
        run: |
          test "$GITHUB_REF" == refs/heads/main
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          if [[ ! "$NATIVE_VERIFICATION" =~ ^https://[^[:space:]]+$ ]]; then
            echo 'Supply the native acceptance record for the exact candidate package hashes.' >&2
            exit 1
          fi
          candidate_api="repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID"
          candidate="$(gh api "$candidate_api")"
          commit="$(jq -er 'select(.conclusion == "success" and .path == ".github/workflows/release.yml") | .head_sha' <<< "$candidate")"
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          successful_ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&status=success&per_page=1" --jq .total_count)"
          if [[ ! "$successful_ci" =~ ^[1-9][0-9]*$ ]]; then
            echo "Repository CI must pass for candidate commit $commit before publishing." >&2
            exit 1
          fi
          run_attempt="$(jq -er '.run_attempt' <<< "$candidate")"
          gh api "$candidate_api/attempts/$run_attempt/jobs?per_page=100" | jq -e '
            [.jobs[] | select(.name == "Verify and upload all draft assets") | .conclusion] == ["success"] and
            ([.jobs[] | select(.name | startswith("Native installation and upgrade validation /")) | .conclusion]
              | length == 4 and all(. == "success"))'
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
          printf 'Native acceptance for commit `%s`, run `%s`\n\n%s\n' \
            "$commit" "$CANDIDATE_RUN_ID" "$NATIVE_VERIFICATION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v7
        with:
          name: openplayer-release-files
          path: release-files
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify release and preserve the 1.x Latest tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_COMMIT" \
            '.tag == $tag and .commit == $sha and
             ([.builds[] | select(.platform | startswith("macos-")) | .distribution] == ["notarized", "notarized"])' \
            release-files/release-assets.json
          draft="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish)"
          jq -e --arg sha "$RELEASE_COMMIT" '.isDraft and .targetCommitish == $sha' <<< "$draft"

          tag_refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$tag_refs" ]]; then
            tag_commit="$(awk 'END { print $1 }' <<< "$tag_refs")"
            test "$tag_commit" == "$RELEASE_COMMIT"
          fi
          gh release download "$RELEASE_TAG" --dir uploaded
          diff --brief --recursive release-files uploaded

          legacy_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$legacy_tag" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$legacy_tag"
