name: Build desktop packages
description: Build the OpenPlayer installers and checksums on a native runner
inputs:
  tag:
    description: Stable version tag matching the workspace version
    required: true
  output:
    description: Directory for packages, checksums, and the build manifest
    required: true
  install-dependencies:
    description: Install the native build dependencies and toolchain prerequisites
    default: "true"
  macos-distribution:
    description: Sign and notarize macOS packages when the Apple credentials are available
    default: "false"
  apple-certificate:
    description: Base64-encoded Developer ID Application PKCS#12 certificate
  apple-certificate-password:
    description: PKCS#12 certificate password
  apple-signing-identity:
    description: Developer ID Application signing identity
  apple-id:
    description: Apple ID used by notarytool
  apple-password:
    description: App-specific password for the Apple ID
  apple-team-id:
    description: Apple Developer team ID
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      if: inputs.install-dependencies == 'true'
      with:
        node-version: 26
        package-manager-cache: false

    - name: Select Rust toolchain
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: rustc --version

    - name: Install Windows packaging dependencies
      if: runner.os == 'Windows' && inputs.install-dependencies == 'true'
      shell: pwsh
      run: |
        ./apps/desktop/scripts/restore-windows-mpv.ps1
        choco install nsis -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install Linux packaging dependencies
      if: runner.os == 'Linux' && inputs.install-dependencies == 'true'
      shell: bash
      run: |
        sudo apt-get update
        bash apps/desktop/scripts/install-linux-build-deps.sh
        sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

    - name: Install macOS packaging dependencies
      if: runner.os == 'macOS' && inputs.install-dependencies == 'true'
      shell: bash
      run: |
        brew install mpv pkg-config
        prefix="$(brew --prefix mpv)"
        for file in "$prefix/include/mpv/render.h" "$prefix/lib/libmpv.dylib"; do
          if [[ ! -f "$file" ]]; then
            echo "Missing libmpv packaging dependency: $file" >&2
            exit 1
          fi
        done
        {
          echo "OPENPLAYER_MPV_DIR=$prefix"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
        } >> "$GITHUB_ENV"

    - name: Verify workspace metadata
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        node apps/desktop/scripts/verify-release.mjs --tag="$RELEASE_TAG"

    - name: Build native Windows installer
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        PACKAGE_OUTPUT: ${{ inputs.output }}
      run: |
        if ($env:RUNNER_ARCH -ne 'X64') { throw 'Expected an x64 Windows runner' }
        $deps = cargo tree -p openplayer-desktop --locked --target x86_64-pc-windows-msvc -e normal,build --prefix none
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ($deps -match '^(tauri|tao|wry|webview2)[ -]') { throw 'Unexpected web runtime dependency' }
        ./apps/desktop/scripts/build-windows.ps1

        $dumpbin = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source
        if (-not $dumpbin) {
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -First 1
        }
        if (-not $dumpbin) { throw 'Could not locate dumpbin in the Windows build tools' }

        $images = @('target/release/openplayer-desktop.exe', 'vendor/native/mpv/windows-x64/libmpv-2.dll')
        foreach ($image in $images) {
          $headers = & $dumpbin /nologo /headers $image
          if ($LASTEXITCODE -ne 0 -or -not ($headers -match '^\s*8664 machine \(x64\)')) {
            throw "Expected an x64 PE image: $image"
          }
          $dependencies = & $dumpbin /nologo /dependents $image
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect runtime imports: $image" }
          $dependencies | Write-Output
          $forbidden = $dependencies -match '^\s*(vcruntime|msvcp\d|msvcr\d|vccorlib|concrt|vcomp|webview2loader|microsoft\.web\.webview2)[^\s]*\.dll\s*$'
          if ($forbidden) { throw "Unexpected runtime dependency in ${image}: $($forbidden.Trim() -join ', ')" }
        }
        node apps/desktop/scripts/stage-release-packages.mjs stage $env:RELEASE_TAG windows-x64 $env:PACKAGE_OUTPUT native

    - name: Build Linux deb and AppImage
      if: runner.os == 'Linux'
      shell: bash
      run: |
        test "$RUNNER_ARCH" == X64
        bash apps/desktop/scripts/build-linux.sh

    - name: Stage Linux packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        PACKAGE_OUTPUT: ${{ inputs.output }}
      run: node apps/desktop/scripts/stage-release-packages.mjs stage "$RELEASE_TAG" linux-x64 "$PACKAGE_OUTPUT" native

    - name: Build macOS app bundle
      if: runner.os == 'macOS'
      shell: bash
      run: |
        export RUSTFLAGS="${RUSTFLAGS:-} -C link-arg=-Wl,-headerpad_max_install_names"
        bash apps/desktop/scripts/build-macos-app.sh

    - name: Build and validate macOS DMG
      if: runner.os == 'macOS'
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        PACKAGE_OUTPUT: ${{ inputs.output }}
        MACOS_DISTRIBUTION: ${{ inputs.macos-distribution }}
        OPENPLAYER_APPLE_CERTIFICATE: ${{ inputs.apple-certificate }}
        OPENPLAYER_APPLE_CERTIFICATE_PASSWORD: ${{ inputs.apple-certificate-password }}
        OPENPLAYER_APPLE_SIGNING_IDENTITY: ${{ inputs.apple-signing-identity }}
        OPENPLAYER_APPLE_ID: ${{ inputs.apple-id }}
        OPENPLAYER_APPLE_PASSWORD: ${{ inputs.apple-password }}
        OPENPLAYER_APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
      run: |
        bundle="${CARGO_TARGET_DIR:-target}/release/bundle/macos/OpenPlayer.app"
        node apps/desktop/scripts/bundle-macos-libmpv.mjs "$bundle"
        case "$RUNNER_ARCH" in
          ARM64) arch=arm64 ;;
          X64) arch=x64 ;;
          *) echo "Unexpected macOS runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        bash apps/desktop/scripts/build-macos-dmg.sh "${RELEASE_TAG#v}" "$arch" "$MACOS_DISTRIBUTION"
