[package]
name = "openplayer-desktop"
default-run = "openplayer-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "openplayer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["mpv-embed", "windows-gpui"]
window-smoke = ["mpv-embed"]
windows-gpui = [
  "mpv-embed",
  "dep:anyhow",
  "dep:gpui",
  "dep:gpui-platform",
  "dep:gpui-ce-motion",
  "dep:ignore",
  "dep:image",
  "dep:rusty-leveldb",
  "dep:windows",
]
mpv-smoke = ["dep:libmpv2"]
mpv-embed = [
  "dep:libmpv2",
  "dep:libmpv2-sys",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:raw-window-handle",
]

[dependencies]
libmpv2 = { version = "7.0.1", optional = true, default-features = false }
libmpv2-sys = { version = "4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
redb = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(not(windows))'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-runtime = "2"
libc = "0.2"
arboard = "3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.11"
tokio = { version = "1", features = ["process", "io-util", "time", "sync"] }
reqwest = "0.13.3"
base64 = "0.23"
tauri-plugin-dialog = "2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(not(windows))'.build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[[bin]]
name = "window-smoke"
path = "src/bin/window-smoke.rs"
required-features = ["window-smoke"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = [
  "NSResponder",
  "NSView",
] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
  "NSGeometry",
  "objc2-core-foundation",
] }

[target.'cfg(windows)'.dependencies]
anyhow = { version = "1", optional = true }
gpui = { package = "gpui-fast", version = "=0.1.19", default-features = false, features = ["windows-manifest-provided-by-host"], optional = true }
gpui-platform = { package = "gpui-fast-platform", version = "=0.1.19", default-features = false, optional = true }
gpui-ce-motion = { version = "=0.4.0", default-features = false, optional = true }
ignore = { version = "0.4.35", optional = true }
image = { version = "0.25", default-features = false, optional = true }
rusty-leveldb = { version = "4.0.2", default-features = false, optional = true }
windows = { version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_UI_WindowsAndMessaging",
] }
